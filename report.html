<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>工序流转 - 追溯查询</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif; background:#f5f6fa; min-height:100vh; -webkit-text-size-adjust:100%; }

/* ===== Header ===== */
.header { background:linear-gradient(135deg,#0d5e5e 0%,#1a7a7a 50%,#0d5e5e 100%); color:#fff; padding:20px 24px 18px; }
.header h1 { font-size:26px; font-weight:700; line-height:1.3; letter-spacing:1px; text-align:center; }
.header h1 .sub-line { font-size:26px; font-weight:700; }
.header .nav-sub { font-size:13px; opacity:.75; margin-top:6px; letter-spacing:.5px; text-align:center; }

/* ===== Info Card ===== */
.info-card { background:linear-gradient(135deg,#0d5e5e 0%,#1a7a7a 100%); border-radius:0; padding:18px 22px; margin:0; color:#fff; position:relative; overflow:hidden; }
.info-card::before { content:''; position:absolute; inset:0; background:url('img/shengyi_xinglong.png') center center/contain no-repeat; opacity:0.5; mix-blend-mode:screen; pointer-events:none; z-index:0; }
.info-card-inner { position:relative; z-index:1; display:flex; align-items:flex-start; gap:12px; }
.info-card-text { flex:1; min-width:0; }
.info-card-title { font-size:14px; font-weight:600; margin-bottom:14px; padding-left:10px; border-left:3px solid rgba(255,255,255,0.7); letter-spacing:1px; }
.info-row { display:flex; align-items:flex-start; padding:6px 0; }
.info-label { font-size:14px; color:rgba(255,255,255,0.65); width:80px; flex-shrink:0; padding-top:2px; white-space:nowrap; }
.info-value { font-size:14px; font-weight:500; color:#fff; flex:1; word-break:break-all; line-height:1.6; white-space:pre-wrap; }

/* ===== Main Layout ===== */
.main-wrapper { max-width:1100px; margin:0 auto; display:flex; gap:0; min-height:calc(100vh - 200px); }

/* Left: History */
.left-panel { flex:1; min-width:0; padding:20px 22px; background:#fff; }
.section-title { font-size:16px; font-weight:600; color:#222; margin-bottom:16px; display:flex; align-items:center; gap:8px; }
.section-title .icon { font-size:18px; }
.record-item { padding:12px 0; border-bottom:1px solid #f0f0f0; }
.record-item:last-child { border-bottom:none; }
.record-row { display:flex; align-items:center; gap:8px; }
.record-icon { font-size:16px; flex-shrink:0; width:22px; text-align:center; }
.record-name { font-size:15px; font-weight:500; color:#222; }
.record-name.pending { color:#f9ab00; }
.record-meta { font-size:13px; color:#888; margin-left:6px; }
.record-extra { font-size:11px; color:#aaa; margin-left:4px; }

/* Right: Form */
.right-panel { width:320px; flex-shrink:0; padding:20px 22px; background:#f8f9fb; border-left:1px solid #eee; }
.form-group { margin-bottom:16px; }
.form-group label { display:block; font-size:14px; color:#555; margin-bottom:6px; font-weight:500; }
.form-group select, .form-group input, .form-group textarea { width:100%; padding:12px 14px; border:1.5px solid #e0e0e0; border-radius:10px; font-size:14px; outline:none; transition:border .2s, box-shadow .2s; background:#fff; color:#333; }
.form-group select:focus, .form-group input:focus, .form-group textarea:focus { border-color:#4fc3f7; box-shadow:0 0 0 3px rgba(79,195,247,0.15); }
.form-group textarea { resize:vertical; min-height:60px; }
.btn-submit { width:100%; padding:15px; background:linear-gradient(135deg,#4fc3f7,#2196f3); color:#fff; border:none; border-radius:12px; font-size:16px; font-weight:600; cursor:pointer; transition:all .2s; margin-top:6px; box-shadow:0 4px 16px rgba(33,150,243,0.35); letter-spacing:1px; }
.btn-submit:hover { background:linear-gradient(135deg,#29b6f6,#1e88e5); box-shadow:0 6px 20px rgba(33,150,243,0.45); }
.btn-submit:active { transform:scale(0.97); }
.btn-submit:disabled { background:#ccc; cursor:not-allowed; box-shadow:none; }

/* Mobile */
@media (max-width:768px) {
  .main-wrapper { flex-direction:column; }
  .right-panel { width:100%; border-left:none; border-top:1px solid #eee; }
  .header { padding:18px 18px 16px; }
  .header h1 { font-size:22px; }
  .header h1 .sub-line { font-size:22px; }
  .info-card { padding:16px 18px; }
  .info-card-inner { gap:8px; }
  .info-label { width:60px; font-size:13px; }
  .info-value { font-size:13px; }
  .left-panel { padding:16px 18px; }
  .right-panel { padding:16px 18px; }
}

/* Empty / loading */
.empty-state { text-align:center; color:#aaa; padding:30px 0; font-size:14px; line-height:1.8; }
.loading { text-align:center; padding:20px; color:#999; font-size:13px; }

/* Toast */
.toast { position:fixed; top:60px; left:50%; transform:translateX(-50%); background:#333; color:#fff; padding:10px 28px; border-radius:24px; font-size:14px; z-index:999; opacity:0; transition:opacity .3s; pointer-events:none; box-shadow:0 4px 16px rgba(0,0,0,0.2); }
.toast.show { opacity:1; }
.toast.success { background:#22c55e; }
.toast.error { background:#ef4444; }

/* Footer */
.footer { text-align:center; padding:20px; font-size:11px; color:#ccc; }
</style>
</head>
<body>

<div class="header">
  <h1>志锦包装工序追溯</h1>
  <div class="nav-sub">扫码查验 | 工序管理</div>
</div>

<!-- 本单工艺要求信息卡 -->
<div class="info-card" id="infoCard" style="display:none;">
  <div class="info-card-inner">
    <div class="info-card-text">
      <div class="info-card-title" id="infoTitle">本单工艺要求</div>
      <div class="info-row">
        <span class="info-label">排版名称：</span>

      </div>
      <div class="info-row">
        <span class="info-label">工艺：</span>

      </div>

  <!-- 右侧：工序上传 -->
  <div class="right-panel">
    <div class="section-title"><span class="icon">📝</span> 工序上传</div>
    <div class="form-group">
      <label>当前工序</label>
      <select id="processSelect">
        <option value="开始生产">开始生产</option>
        <option value="印刷">印刷</option>
        <option value="哑胶/光胶/哑油/光油">哑胶/光胶/哑油/光油</option>
        <option value="烫金/烫银">烫金/烫银</option>
        <option value="击凸/击凹">击凸/击凹</option>
        <option value="局部UV">局部UV</option>

        <option value="Hfj-工艺">Hfj-工艺</option>

</div>

<div class="footer">印刷追溯系统 v2.1</div>

<div class="toast" id="toast"></div>

<script>
// ============ API 地址 ============
var API_BASE = "https://1465018414-7ccocada9n.ap-guangzhou.tencentscf.com";

// ============ 工序关键词匹配映射（用于将提交记录匹配到工艺字段中的具体项） ============
// 飞书 SingleSelect 标准选项名（工序字段只接受这些值）
var FEISHU_PROCESS_OPTIONS = [
  '开始生产', '印刷', '哑胶/光胶/哑油/光油', '烫金/烫银',
  '击凸/击凹', '局部UV', '坑/对裱', '模切', '待出货'
];

// 关键词 → 飞书标准选项 映射（用于将工艺原文片段映射为可提交的值）
var KEYWORD_TO_OPTION = {
  '印刷': '印刷', '印': '印刷', '彩印': '印刷', '胶印': '印刷', '丝印': '印刷',
  '哑胶': '哑胶/光胶/哑油/光油', '覆哑膜': '哑胶/光胶/哑油/光油', '过哑胶': '哑胶/光胶/哑油/光油', '过哑膜': '哑胶/光胶/哑油/光油',
  '光胶': '哑胶/光胶/哑油/光油', '覆光膜': '哑胶/光胶/哑油/光油', '过光胶': '哑胶/光胶/哑油/光油', '过光膜': '哑胶/光胶/哑油/光油',
  '哑油': '哑胶/光胶/哑油/光油', '过哑油': '哑胶/光胶/哑油/光油',
  '光油': '哑胶/光胶/哑油/光油', '过光油': '哑胶/光胶/哑油/光油',
  '吸塑油': '哑胶/光胶/哑油/光油', '吸塑': '哑胶/光胶/哑油/光油',
  '烫金': '烫金/烫银', '烫印': '烫金/烫银', '电化铝': '烫金/烫银',
  '烫银': '烫金/烫银',
  '击凸': '击凸/击凹', '击凹凸': '击凸/击凹', '凹凸': '击凸/击凹',
  '击凹': '击凸/击凹',
  '局部UV': '局部UV', 'UV': '局部UV', 'uv': '局部UV',
  '裱坑': '坑/对裱', '裱纸': '坑/对裱', '裱瓦': '坑/对裱', '贴坑': '坑/对裱',
  '对裱': '坑/对裱', '裱楞': '坑/对裱',
  '模切': '模切', '啤': '模切', '啤切': '模切', '冲切': '模切',
  '待出货': '待出货', '出货': '待出货', '发货': '待出货'
};

// 将工艺原文片段映射为飞书单选选项名
function craftSegmentToOption(seg) {
  var core = seg.replace(/^(正面|背面|正面过|背面过)/, '').trim().toLowerCase();
  // 精确匹配关键词
  for (var kw in KEYWORD_TO_OPTION) {
    if (core === kw.toLowerCase()) return KEYWORD_TO_OPTION[kw];
  }
  // 包含匹配
  for (var kw2 in KEYWORD_TO_OPTION) {
    if (kw2.length >= 2 && core.indexOf(kw2.toLowerCase()) >= 0) return KEYWORD_TO_OPTION[kw2];
  }
  // 含"裱"字的归入坑/对裱
  if (core.indexOf('裱') >= 0) return '坑/对裱';
  // 含"胶"字的归入哑胶/光胶/哑油/光油
  if (core.indexOf('胶') >= 0) return '哑胶/光胶/哑油/光油';
  // 已是标准选项
  for (var i = 0; i < FEISHU_PROCESS_OPTIONS.length; i++) {
    if (core === FEISHU_PROCESS_OPTIONS[i].toLowerCase()) return FEISHU_PROCESS_OPTIONS[i];
  }
  return null; // 无法映射
}

var PROCESS_KEYWORDS = {
  '印刷': ['印刷', '印', '彩印', '胶印', '丝印'],
  '哑胶': ['哑胶', '覆哑膜', '过哑胶'],
  '光胶': ['光胶', '覆光膜', '过光胶'],
  '哑油': ['哑油', '过哑油'],
  '光油': ['光油', '过光油'],
  '吸塑油': ['吸塑油', '吸塑'],
  '烫金': ['烫金', '烫印', '电化铝'],
  '烫银': ['烫银'],
  '击凸': ['击凸', '击凹凸', '凹凸'],
  '击凹': ['击凹'],
  '局部UV': ['局部UV', 'UV', 'uv'],
  '裱坑': ['裱坑', '裱纸', '裱瓦', '贴坑'],
  '对裱': ['对裱', '裱楞'],
  '模切': ['模切', '啤', '啤切', '冲切'],
  '待出货': ['待出货', '出货', '发货']
};

var requiredProcesses = [];

// 从工艺文本解析出具体工序列表（按原文显示）
function parseCraftText(text) {
  if (!text || text === '未填写') return [];
  var items = [];
  var segments = text.split(/[-—,，、/;；\s]+/);
  var hasPrint = false;
  for (var i = 0; i < segments.length; i++) {
    var seg = segments[i].replace(/^(正面|背面|正面过|背面过)/, '').trim();
    if (!seg) continue;
    if (/^印刷$/.test(seg)) { hasPrint = true; continue; }
    // 保留原始文本段（含正面/背面等前缀）
    var original = segments[i].trim();
    if (original && items.indexOf(original) < 0) items.push(original);
  }
  if (!hasPrint) items.unshift('印刷');
  return items;
}

// 判断提交的工序是否匹配某个工艺段
function processItemMatches(submittedProcess, craftItem) {
  if (!submittedProcess || !craftItem) return false;
  var sp = submittedProcess.trim().toLowerCase();
  var ci = craftItem.trim().toLowerCase();
  if (sp === ci) return true;
  if (ci.indexOf(sp) >= 0 || sp.indexOf(ci) >= 0) return true;
  // 去掉正面/背面前缀后再比
  var ciCore = ci.replace(/^(正面|背面)/, '');
  if (sp.indexOf(ciCore) >= 0 || ciCore.indexOf(sp) >= 0) return true;
  // 若提交的是飞书标准选项名（如"坑/对裱"），拆分后逐个匹配工艺段
  if (sp.indexOf('/') >= 0) {
    var parts = sp.split('/');
    for (var p = 0; p < parts.length; p++) {
      var part = parts[p].trim().toLowerCase();
      if (part && ciCore.indexOf(part) >= 0) return true;
    }
  }
  // 通过关键词映射匹配
  for (var keyword in PROCESS_KEYWORDS) {
    var synonyms = PROCESS_KEYWORDS[keyword];
    var craftHas = false, submitHas = false;
    for (var i = 0; i < synonyms.length; i++) {
      if (ciCore.indexOf(synonyms[i].toLowerCase()) >= 0) craftHas = true;
      if (sp.indexOf(synonyms[i].toLowerCase()) >= 0) submitHas = true;
    }
    if (craftHas && submitHas) return true;
  }
  // 兜底：通过 craftSegmentToOption 映射比较
  var mappedOption = craftSegmentToOption(craftItem);
  if (mappedOption && sp === mappedOption.toLowerCase()) return true;
  return false;
}

function extractText(val) {
  if (!val) return '未填写';
  if (typeof val === 'string') return val;
  if (Array.isArray(val) && val.length > 0) {
    var parts = [];
    for (var i = 0; i < val.length; i++) {
      if (val[i] && val[i].text !== undefined) {
        parts.push(val[i].text);
      } else if (typeof val[i] === 'string') {
        parts.push(val[i]);
      }
    }
    return parts.length > 0 ? parts.join('') : '未填写';
  }
  return '未填写';
}

function getLayoutName() {
  var params = new URLSearchParams(window.location.search);
  var name = params.get('排版名称');
  if (name) return name;
  name = params.get('name');
  if (name) return name;
  var hash = window.location.hash;
  if (hash && hash.indexOf('name=') >= 0) {
    return decodeURIComponent(hash.split('name=')[1].split('&')[0]);
  }
  return '';
}

function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (type || '');
  var duration = (type === 'error') ? 8000 : 2500;
  setTimeout(function(){ t.className = 'toast'; }, duration);
}

function loadProcessInfo(layoutName) {
  var url = API_BASE + '/api/info?layout_name=' + encodeURIComponent(layoutName);
  return fetch(url)
    .then(function(r){ return r.json(); })
    .then(function(data) {
      if (data.success && data.data) {
        document.getElementById('infoCard').style.display = 'block';
        document.getElementById('infoLayoutName').textContent = data.data['排版名称'] || layoutName;
        document.getElementById('infoMaterial').textContent = data.data['材质'] || '未填写';
        var processText = data.data['工艺'] || '未填写';
        document.getElementById('infoProcess').textContent = processText;
        document.getElementById('infoMold').textContent = data.data['刀模'] || '未填写';
        document.getElementById('infoQuantity').textContent = data.data['数量'] || '未填写';
        requiredProcesses = parseCraftText(processText);
      } else {
        document.getElementById('infoCard').style.display = 'none';
        requiredProcesses = [];
      }
    })
    .catch(function(err) {
      document.getElementById('infoCard').style.display = 'none';
      requiredProcesses = [];
    });
}

function loadHistory(layoutName) {
  var container = document.getElementById('historyList');
  var url = API_BASE + '/api/records?layout_name=' + encodeURIComponent(layoutName);

  fetch(url)
    .then(function(r){ return r.json(); })
    .then(function(data) {
      var records = data.records || [];

      if (requiredProcesses.length === 0) {
        if (records.length === 0) {
          container.innerHTML = '<div class="empty-state">暂无历史记录<br>扫码上报第一条工序</div>';
        } else {
          var html = '';
          records.forEach(function(rec) {
            var statusText = extractText(rec.状态);
            var done = (statusText === '已完成' || statusText === '✅');
            html += buildRecordHTML(rec.工序, rec, done);
          });
          container.innerHTML = html;
        }
        return;
      }

      // 匹配每个工艺项与提交记录
      var completed = {};
      var matchedRecs = {};
      var extraRecs = [];

      records.forEach(function(rec) {
        var statusText = extractText(rec.状态);
        var done = (statusText === '已完成' || statusText === '✅');
        var matched = false;

        for (var i = 0; i < requiredProcesses.length; i++) {
          var item = requiredProcesses[i];
          if (processItemMatches(rec.工序, item)) {
            matched = true;
            if (!matchedRecs[item] || rec.更新时间 > matchedRecs[item].更新时间) {
              matchedRecs[item] = rec;
            }
            if (done) completed[item] = true;
            break;
          }
        }

        if (!matched) extraRecs.push(rec);
      });

      // 生成HTML
      var html = '';
      var pending = [];

      requiredProcesses.forEach(function(item) {
        if (completed[item] && matchedRecs[item]) {
          html += buildRecordHTML(item, matchedRecs[item], true);
        } else if (matchedRecs[item]) {
          html += buildRecordHTML(item, matchedRecs[item], false);
        } else {
          pending.push(item);
          html += '<div class="record-item"><div class="record-row">';
          html += '<span class="record-icon">⏳</span>';
          html += '<span class="record-name pending">' + item + '</span>';
          html += '<span class="record-meta">(待完成)</span>';
          html += '</div></div>';
        }
      });

      extraRecs.forEach(function(rec) {
        var statusText = extractText(rec.状态);
        var done = (statusText === '已完成' || statusText === '✅');
        html += buildRecordHTML(rec.工序, rec, done, true);
      });

      container.innerHTML = html;

      // 更新工序下拉框：只显示待完成的工艺项
      // 值映射为飞书标准选项名（防止 TextFieldConvFail），显示仍为原文
      var select = document.getElementById('processSelect');
      select.innerHTML = '';
      var addedOptions = {}; // 去重：同一标准选项只加一次
      pending.forEach(function(p) {
        var mapped = craftSegmentToOption(p) || p;
        if (addedOptions[mapped]) return;
        addedOptions[mapped] = true;
        var opt = document.createElement('option');
        opt.value = mapped; // 提交时用标准选项名
        opt.textContent = p; // 显示原文
        select.appendChild(opt);
      });
      if (pending.length === 0) {
        var opt = document.createElement('option');
        opt.value = '';
        opt.textContent = '✅ 全部工序已完成';
        select.appendChild(opt);
      }
    })
    .catch(function(err) {
      container.innerHTML = '<div class="empty-state">加载失败，请检查网络<br><small>' + err.message + '</small></div>';
    });
}

function buildRecordHTML(displayName, rec, isDone, isExtra) {
  var html = '<div class="record-item"' + (isExtra ? ' style="opacity:0.55"' : '') + '>';
  html += '<div class="record-row">';
  html += '<span class="record-icon">' + (isDone ? '✅' : '') + '</span>';
  html += '<span class="record-name' + (isDone ? '' : ' pending') + '">' + displayName + '</span>';
  var reporterName = rec.上报人 || '';
  var timeStr = '';
  if (rec.更新时间) {
    var d = new Date(rec.更新时间);
    var pad = function(n){ return n < 10 ? '0'+n : n; };
    var mo = d.getMonth() + 1;
    var day = d.getDate();
    timeStr = mo + '月' + day + '日 ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  if (isDone) {
    html += '<span class="record-meta" style="color:#22c55e;">(已完成';
    if (reporterName) html += ' ' + reporterName;
    if (timeStr) html += ' ' + timeStr;
    html += ')</span>';
  } else if (reporterName || timeStr) {
    html += '<span class="record-meta">(';
    if (reporterName) html += reporterName;
    if (reporterName && timeStr) html += ' ' + timeStr;
    html += ')</span>';
  }
  html += '</div>';
  html += '</div>';
  return html;
}

function submitReport() {
  var layoutName = getLayoutName();
  var process = document.getElementById('processSelect').value;
  var reporter = document.getElementById('reporterSelect').value;

  if (!layoutName) {
    showToast('排版名称为空，请检查二维码URL', 'error');
    return;
  }
  if (!process) {
    showToast('所有工序已完成，无需上报', 'error');
    return;
  }
  if (!reporter) {
    showToast('请选择上报人', 'error');
    return;
  }

  var btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = '提交中...';

  var remark = document.getElementById('remark').value.trim();

  var url = API_BASE + '/api/records';
  var body = {
    layout_name: layoutName,
    process: process,
    reporter: reporter,
    remark: remark
  };

  fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  })
  .then(function(r) {
    return r.text().then(function(text) {
      try { return JSON.parse(text); }
      catch(e) { throw new Error('返回数据格式错误: ' + text.substring(0, 200)); }
    });
  })
  .then(function(data) {
    if (data.success) {
      showToast('工序上报成功！', 'success');
      document.getElementById('remark').value = '';
      loadHistory(layoutName);
    } else {
      showToast('提交失败: ' + JSON.stringify(data).substring(0, 100), 'error');
    }
  })
  .catch(function(err) {
    showToast('提交失败: ' + err.message, 'error');
  })
  .finally(function() {
    btn.disabled = false;
    btn.textContent = '提交工序';
  });
}

// ============ 初始化 ============
(function init() {
  var layoutName = getLayoutName();
  if (!layoutName) {
    document.querySelector('.nav-sub').textContent = 'URL中缺少「排版名称」参数';
    document.getElementById('historyList').innerHTML = '<div class="empty-state">请通过扫描产品二维码进入</div>';
    document.querySelector('.right-panel').style.display = 'none';
    return;
  }

  loadProcessInfo(layoutName).then(function() {
    loadHistory(layoutName);
  });
})();
</script>
