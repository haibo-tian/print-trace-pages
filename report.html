<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>工序流转 - 追溯查询</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif; background:#f5f6fa; min-height:100vh; -webkit-text-size-adjust:100%; }

/* ===== Header ===== */
.header { background:linear-gradient(135deg,#0d5e5e 0%,#1a7a7a 50%,#0d5e5e 100%); color:#fff; padding:20px 24px 18px; }
.header h1 { font-size:26px; font-weight:700; line-height:1.3; letter-spacing:1px; text-align:center; }
.header h1 .sub-line { font-size:26px; font-weight:700; }
.header .nav-sub { font-size:13px; opacity:.75; margin-top:6px; letter-spacing:.5px; text-align:center; }

/* ===== Info Card ===== */
.info-card { background:linear-gradient(135deg,#0d5e5e 0%,#1a7a7a 100%); border-radius:0; padding:18px 22px; margin:0; color:#fff; }
.info-card-inner { }
.info-card-title { font-size:14px; font-weight:600; margin-bottom:14px; padding-left:10px; border-left:3px solid rgba(255,255,255,0.7); letter-spacing:1px; }
.info-row { display:flex; align-items:flex-start; padding:6px 0; }
.info-label { font-size:14px; color:rgba(255,255,255,0.65); width:80px; flex-shrink:0; padding-top:2px; white-space:nowrap; }
.info-value { font-size:14px; font-weight:500; color:#fff; flex:1; word-break:break-all; line-height:1.6; white-space:pre-wrap; }

/* ===== Main Layout ===== */
.main-wrapper { max-width:1100px; margin:0 auto; display:flex; gap:0; min-height:calc(100vh - 200px); }

/* Left: History */
.left-panel { flex:1; min-width:0; padding:20px 22px; background:#fff; }
.section-title { font-size:16px; font-weight:600; color:#222; margin-bottom:16px; display:flex; align-items:center; gap:8px; }
.section-title .icon { font-size:18px; }
.record-item { padding:12px 0; border-bottom:1px solid #f0f0f0; }
.record-item:last-child { border-bottom:none; }
.record-row { display:flex; align-items:center; gap:8px; }
.record-icon { font-size:16px; flex-shrink:0; width:22px; text-align:center; }
.record-name { font-size:15px; font-weight:500; color:#222; }
.record-name.pending { color:#f9ab00; }
.record-meta { font-size:13px; color:#888; margin-left:6px; }
.record-extra { font-size:11px; color:#aaa; margin-left:4px; }

/* Right: Form */
.right-panel { width:320px; flex-shrink:0; padding:20px 22px; background:#f8f9fb; border-left:1px solid #eee; }
.form-group { margin-bottom:16px; }
.form-group label { display:block; font-size:14px; color:#555; margin-bottom:6px; font-weight:500; }
.form-group select, .form-group input, .form-group textarea { width:100%; padding:12px 14px; border:1.5px solid #e0e0e0; border-radius:10px; font-size:14px; outline:none; transition:border .2s, box-shadow .2s; background:#fff; color:#333; }
.form-group select:focus, .form-group input:focus, .form-group textarea:focus { border-color:#4fc3f7; box-shadow:0 0 0 3px rgba(79,195,247,0.15); }
.form-group textarea { resize:vertical; min-height:60px; }
.btn-submit { width:100%; padding:15px; background:linear-gradient(135deg,#4fc3f7,#2196f3); color:#fff; border:none; border-radius:12px; font-size:16px; font-weight:600; cursor:pointer; transition:all .2s; margin-top:6px; box-shadow:0 4px 16px rgba(33,150,243,0.35); letter-spacing:1px; }
.btn-submit:hover { background:linear-gradient(135deg,#29b6f6,#1e88e5); box-shadow:0 6px 20px rgba(33,150,243,0.45); }
.btn-submit:active { transform:scale(0.97); }
.btn-submit:disabled { background:#ccc; cursor:not-allowed; box-shadow:none; }

/* Mobile */
@media (max-width:768px) {
  .main-wrapper { flex-direction:column; }
  .right-panel { width:100%; border-left:none; border-top:1px solid #eee; }
  .header { padding:18px 18px 16px; }
  .header h1 { font-size:22px; }
  .header h1 .sub-line { font-size:22px; }
  .info-card { padding:16px 18px; }
  .info-label { width:60px; font-size:13px; }
  .info-value { font-size:13px; }
  .left-panel { padding:16px 18px; }
  .right-panel { padding:16px 18px; }
}

/* Empty / loading */
.empty-state { text-align:center; color:#aaa; padding:30px 0; font-size:14px; line-height:1.8; }
.loading { text-align:center; padding:20px; color:#999; font-size:13px; }

/* Toast */
.toast { position:fixed; top:60px; left:50%; transform:translateX(-50%); background:#333; color:#fff; padding:10px 28px; border-radius:24px; font-size:14px; z-index:999; opacity:0; transition:opacity .3s; pointer-events:none; box-shadow:0 4px 16px rgba(0,0,0,0.2); }
.toast.show { opacity:1; }
.toast.success { background:#22c55e; }
.toast.error { background:#ef4444; }

/* Footer */
.footer { text-align:center; padding:20px; font-size:11px; color:#ccc; }
</style>
</head>
<body>

<div class="header">
  <h1>志锦包装工序追溯</h1>
  <div class="nav-sub">扫码查验 | 工序管理</div>
</div>

<!-- 本单工艺要求信息卡 -->
<div class="info-card" id="infoCard" style="display:none;">
  <div class="info-card-inner">
    <div class="info-card-title">本单工艺要求</div>
    <div class="info-row">
      <span class="info-label">材质：</span>
      <span class="info-value" id="infoMaterial">-</span>
    </div>
    <div class="info-row">
      <span class="info-label">工艺：</span>
      <span class="info-value" id="infoProcess">-</span>
    </div>
    <div class="info-row" style="display:flex; gap:24px;">
      <div style="display:flex; align-items:flex-start; flex:1;">
        <span class="info-label">刀模编号：</span>
        <span class="info-value" id="infoMold">-</span>
      </div>
      <div style="display:flex; align-items:flex-start; flex:1;">
        <span class="info-label">印刷数量：</span>
        <span class="info-value" id="infoQuantity">-</span>
      </div>
    </div>
  </div>
</div>

<div class="main-wrapper">
  <!-- 左侧：历史工艺记录 -->
  <div class="left-panel">
    <div class="section-title"><span class="icon">📋</span> 历史工艺记录</div>
    <div id="historyList"><div class="loading">正在加载记录...</div></div>
  </div>

  <!-- 右侧：工序上传 -->
  <div class="right-panel">
    <div class="section-title"><span class="icon">📝</span> 工序上传</div>
    <div class="form-group">
      <label>当前工序</label>
      <select id="processSelect">
        <option value="开始生产">开始生产</option>
        <option value="印刷">印刷</option>
        <option value="哑胶/光胶/哑油/光油">哑胶/光胶/哑油/光油</option>
        <option value="烫金/烫银">烫金/烫银</option>
        <option value="击凸/击凹">击凸/击凹</option>
        <option value="局部UV">局部UV</option>
        <option value="裱坑/对裱">裱坑/对裱</option>
        <option value="模切">模切</option>
        <option value="待出货">待出货</option>
      </select>
    </div>
    <div class="form-group">
      <label>上报人</label>
      <select id="reporterSelect">
        <option value="">请选择上报人</option>
        <option value="Yp-印刷">Yp-印刷</option>
        <option value="Xsx-印刷">Xsx-印刷</option>
        <option value="Xfh-工艺">Xfh-工艺</option>
        <option value="Hfj-工艺">Hfj-工艺</option>
        <option value="Yw-压纹">Yw-压纹</option>
        <option value="Xhy-工艺">Xhy-工艺</option>
        <option value="模切-李">模切-李</option>
        <option value="模切-魏">模切-魏</option>
        <option value="模切-陆">模切-陆</option>
        <option value="开始-采购">开始-采购</option>
        <option value="待出货-车间">待出货-车间</option>
      </select>
    </div>
    <div class="form-group">
      <label>备注（可选）</label>
      <textarea id="remark" placeholder="数量、异常情况等"></textarea>
    </div>
    <button class="btn-submit" id="submitBtn" onclick="submitReport()">提交工序</button>
  </div>
</div>

<div class="footer">印刷追溯系统 v2.1</div>

<div class="toast" id="toast"></div>

<script>
// ============ API 地址 ============
var API_BASE = "https://1465018414-5mu1e1gw37.ap-guangzhou.tencentscf.com";

// ============ 工序同义词映射 ============
var PROCESS_SYNONYMS = {
  '开始生产': ['开始生产', '开始'],
  '印刷': ['印刷', '印', '彩印', '胶印', '丝印', 'UV印刷'],
  '哑胶/光胶/哑油/光油': ['哑胶', '光胶', '哑油', '光油', '覆膜', '过胶', '覆哑膜', '覆光膜', '哑胶/光胶/哑油/光油', '过哑胶', '过光胶', '贴膜', '裱膜', '吸塑油', '吸塑', '过油', '上油'],
  '烫金/烫银': ['烫金', '烫银', '烫金/烫银', '烫印', '电化铝'],
  '击凸/击凹': ['击凸', '击凹', '击凹凸', '击凸/击凹', '凹凸'],
  '局部UV': ['局部UV', 'UV', 'uv', '局部'],
  '裱坑/对裱': ['裱坑', '对裱', '裱纸', '裱瓦', '贴坑', '裱楞', '裱坑/对裱'],
  '模切': ['模切', '刀模', '啤', '啤切', '冲切', '切'],
  '待出货': ['待出货', '出货', '发货']
};

var requiredProcesses = [];
var completedStandardProcesses = [];

function normalizeProcessName(input) {
  if (!input) return '';
  var trimmed = input.trim();
  for (var stdName in PROCESS_SYNONYMS) {
    var aliases = PROCESS_SYNONYMS[stdName];
    for (var i = 0; i < aliases.length; i++) {
      if (trimmed === aliases[i]) return stdName;
    }
    for (var i = 0; i < aliases.length; i++) {
      if (trimmed.indexOf(aliases[i]) >= 0 || aliases[i].indexOf(trimmed) >= 0) {
        return stdName;
      }
    }
  }
  return trimmed;
}

function parseRequiredProcesses(processText) {
  if (!processText || processText === '未填写') return [];
  var found = [];
  for (var stdName in PROCESS_SYNONYMS) {
    var aliases = PROCESS_SYNONYMS[stdName];
    for (var i = 0; i < aliases.length; i++) {
      if (processText.indexOf(aliases[i]) >= 0) {
        found.push(stdName);
        break;
      }
    }
  }
  return found;
}

function extractText(val) {
  if (!val) return '未填写';
  if (typeof val === 'string') return val;
  if (Array.isArray(val) && val.length > 0) {
    var parts = [];
    for (var i = 0; i < val.length; i++) {
      if (val[i] && val[i].text !== undefined) {
        parts.push(val[i].text);
      } else if (typeof val[i] === 'string') {
        parts.push(val[i]);
      }
    }
    return parts.length > 0 ? parts.join('') : '未填写';
  }
  return '未填写';
}

function getLayoutName() {
  var params = new URLSearchParams(window.location.search);
  var name = params.get('排版名称');
  if (name) return name;
  name = params.get('name');
  if (name) return name;
  var hash = window.location.hash;
  if (hash && hash.indexOf('name=') >= 0) {
    return decodeURIComponent(hash.split('name=')[1].split('&')[0]);
  }
  return '';
}

function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (type || '');
  setTimeout(function(){ t.className = 'toast'; }, 2500);
}

function loadProcessInfo(layoutName) {
  var url = API_BASE + '/api/info?layout_name=' + encodeURIComponent(layoutName);
  fetch(url)
    .then(function(r){ return r.json(); })
    .then(function(data) {
      if (data.success && data.info) {
        document.getElementById('infoCard').style.display = 'block';
        document.getElementById('infoMaterial').textContent = extractText(data.info.material);
        var processText = extractText(data.info.process);
        document.getElementById('infoProcess').textContent = processText;
        document.getElementById('infoMold').textContent = extractText(data.info.mold);
        document.getElementById('infoQuantity').textContent = extractText(data.info.quantity);
        requiredProcesses = parseRequiredProcesses(processText);
      } else {
        document.getElementById('infoCard').style.display = 'none';
        requiredProcesses = [];
      }
    })
    .catch(function(err) {
      document.getElementById('infoCard').style.display = 'none';
      requiredProcesses = [];
    });
}

function loadHistory(layoutName) {
  var container = document.getElementById('historyList');
  var url = API_BASE + '/api/records?layout_name=' + encodeURIComponent(layoutName);

  fetch(url)
    .then(function(r){ return r.json(); })
    .then(function(data) {
      var records = data.records || [];

      if (requiredProcesses.length === 0) {
        if (records.length === 0) {
          container.innerHTML = '<div class="empty-state">暂无历史记录<br>扫码上报第一条工序</div>';
        } else {
          var html = '';
          records.forEach(function(rec) {
            var done = (rec.状态 === '已完成' || rec.状态 === '✅');
            html += buildRecordHTML(rec.工序, rec, done);
          });
          container.innerHTML = html;
        }
        return;
      }

      completedStandardProcesses = [];
      var matchedRecords = {};

      records.forEach(function(rec) {
        var stdName = normalizeProcessName(rec.工序);
        var done = (rec.状态 === '已完成' || rec.状态 === '✅');

        var matched = false;
        for (var i = 0; i < requiredProcesses.length; i++) {
          if (requiredProcesses[i] === stdName) {
            matched = true;
            if (!matchedRecords[stdName] || rec.更新时间 > matchedRecords[stdName].更新时间) {
              matchedRecords[stdName] = rec;
            }
            if (done && completedStandardProcesses.indexOf(stdName) === -1) {
              completedStandardProcesses.push(stdName);
            }
            break;
          }
        }

        if (!matched) {
          var key = '__extra__' + rec.工序;
          if (!matchedRecords[key]) {
            matchedRecords[key] = rec;
          }
        }
      });

      var html = '';

      requiredProcesses.forEach(function(stdName) {
        if (matchedRecords[stdName]) {
          var rec = matchedRecords[stdName];
          var done = completedStandardProcesses.indexOf(stdName) >= 0;
          html += buildRecordHTML(stdName, rec, done);
        }
      });

      var pendingProcs = requiredProcesses.filter(function(p) {
        return completedStandardProcesses.indexOf(p) === -1;
      });
      pendingProcs.forEach(function(p) {
        html += '<div class="record-item">';
        html += '<div class="record-row">';
        html += '<span class="record-icon">⏳</span>';
        html += '<span class="record-name pending">' + p + '</span>';
        html += '<span class="record-meta">(待完成)</span>';
        html += '</div>';
        html += '</div>';
      });

      for (var key in matchedRecords) {
        if (key.indexOf('__extra__') === 0) {
          var rec = matchedRecords[key];
          var done = (rec.状态 === '已完成' || rec.状态 === '✅');
          html += buildRecordHTML(rec.工序, rec, done, true);
        }
      }

      container.innerHTML = html;

      // 更新工序下拉框：只显示待完成的工序
      var select = document.getElementById('processSelect');
      select.innerHTML = '';
      pendingProcs.forEach(function(p) {
        var opt = document.createElement('option');
        opt.value = p;
        opt.textContent = p;
        select.appendChild(opt);
      });
      if (pendingProcs.length === 0) {
        var opt = document.createElement('option');
        opt.value = '';
        opt.textContent = '✅ 全部工序已完成';
        select.appendChild(opt);
      }
    })
    .catch(function(err) {
      container.innerHTML = '<div class="empty-state">加载失败，请检查网络<br><small>' + err.message + '</small></div>';
    });
}

function buildRecordHTML(displayName, rec, isDone, isExtra) {
  var html = '<div class="record-item"' + (isExtra ? ' style="opacity:0.55"' : '') + '>';
  html += '<div class="record-row">';
  html += '<span class="record-icon">' + (isDone ? '✅' : '⏳') + '</span>';
  html += '<span class="record-name' + (isDone ? '' : ' pending') + '">' + displayName + '</span>';
  if (rec.工序 !== displayName) {
    html += '<span class="record-extra">(原:' + rec.工序 + ')</span>';
  }
  // 显示上报人和时间
  var reporterName = rec.上报人 || '';
  var timeStr = '';
  if (rec.更新时间) {
    var d = new Date(rec.更新时间);
    var pad = function(n){ return n < 10 ? '0'+n : n; };
    timeStr = pad(d.getMonth()+1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  if (reporterName || timeStr) {
    html += '<span class="record-meta">(' + reporterName + (reporterName && timeStr ? ', ' : '') + timeStr + ')</span>';
  }
  html += '</div>';
  html += '</div>';
  return html;
}

function submitReport() {
  var layoutName = getLayoutName();
  var process = document.getElementById('processSelect').value;
  var reporter = document.getElementById('reporterSelect').value;

  if (!layoutName) {
    showToast('排版名称为空，请检查二维码URL', 'error');
    return;
  }
  if (!process) {
    showToast('所有工序已完成，无需上报', 'error');
    return;
  }
  if (!reporter) {
    showToast('请选择上报人', 'error');
    return;
  }

  var btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = '提交中...';

  var remark = document.getElementById('remark').value.trim();

  var url = API_BASE + '/api/records';
  var body = {
    layout_name: layoutName,
    process: process,
    reporter: reporter,
    remark: remark
  };

  fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  })
  .then(function(r){ return r.json(); })
  .then(function(data) {
    if (data.success) {
      showToast('工序上报成功！', 'success');
      document.getElementById('remark').value = '';
      loadHistory(layoutName);
    } else {
      showToast('提交失败: ' + (data.message || '未知错误'), 'error');
    }
  })
  .catch(function(err) {
    showToast('提交失败: 网络错误 - ' + err.message, 'error');
  })
  .finally(function() {
    btn.disabled = false;
    btn.textContent = '提交工序';
  });
}

// ============ 初始化 ============
(function init() {
  var layoutName = getLayoutName();
  if (!layoutName) {
    document.querySelector('.nav-sub').textContent = 'URL中缺少「排版名称」参数';
    document.getElementById('historyList').innerHTML = '<div class="empty-state">请通过扫描产品二维码进入</div>';
    document.querySelector('.right-panel').style.display = 'none';
    return;
  }

  loadProcessInfo(layoutName);
  loadHistory(layoutName);
})();
</script>
</body>
</html>
